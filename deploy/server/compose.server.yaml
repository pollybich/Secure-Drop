# Paths resolve relative to the first Compose file (repository-root compose.yaml).
x-server-defaults: &server-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  db:
    <<: *server-defaults
  backend:
    <<: *server-defaults
    build:
      context: ./.runtime/server/backend
    stop_grace_period: 30s
  frontend:
    <<: *server-defaults
    build:
      context: ./.runtime/server/frontend
  caddy:
    <<: *server-defaults
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  caddy_data:
  caddy_config:
