server {
    listen 80;
    server_name drop.pollybich.ru;
    access_log off;
    error_log /dev/null crit;
    location /.well-known/acme-challenge/ {
        root /var/www/pollydrop-acme;
    }
    location / { return 301 https://drop.pollybich.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name drop.pollybich.ru;
    ssl_certificate /etc/letsencrypt/live/drop.pollybich.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drop.pollybich.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 26m;
    # Paths contain secret read/manage tokens. Do not record request URLs.
    access_log off;
    error_log /dev/null crit;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
