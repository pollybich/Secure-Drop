# Temporary HTTP-only ACME site. Do not expose transfer contents before HTTPS.
server {
    listen 80;
    server_name drop.pollybich.ru;
    access_log off;
    error_log /dev/null crit;
    location /.well-known/acme-challenge/ {
        root /var/www/pollydrop-acme;
    }
    location / { return 503; }
}
